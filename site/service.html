    try { if (!THEMES[t]) t = localStorage.getItem('novaShieldTheme'); } catch (e) {}
    if (!THEMES[t]) t = 'refined';
    document.documentElement.dataset.theme = t;
    document.write('<link id="themeCss" rel="stylesheet" href="' + THEMES[t] + '">');
  })();
</script>
